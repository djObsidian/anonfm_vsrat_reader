name: Release

# Triggers:
#   push of a tag like v1.2.3   -> build all 13 targets, attach as a draft
#                                  GitHub Release (so a human reviews and
#                                  hits "Publish")
#   manual workflow_dispatch    -> build everything, leave artifacts on the
#                                  Actions run page, no release created
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed by the release job to create the draft

env:
  ZIG_VERSION: 0.13.0   # bump together with the cache key below

jobs:
  # =====================================================================
  # Build: 13-target matrix.
  #
  # Linux: cross-compiled with `zig cc` (one toolchain tarball, all 11
  # archs covered, downloaded from ziglang.org which GH Actions can
  # reach — unlike musl.cc).
  #
  # Windows: cross-compiled with mingw-w64 from the Ubuntu apt repo.
  # =====================================================================
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux via zig cc (musl-static) -----------------------
          # zig_target uses Zig's LLVM-style triple (e.g. "x86" not
          # "i686", "arm" not "armv7l"); mcpu refines the ARM variant.
          - { name: linux-x86_64,  kind: zig, zig_target: x86_64-linux-musl,    ext: '' }
          - { name: linux-i686,    kind: zig, zig_target: x86-linux-musl,       ext: '' }
          - { name: linux-aarch64, kind: zig, zig_target: aarch64-linux-musl,   ext: '' }
          - { name: linux-armv7,   kind: zig, zig_target: arm-linux-musleabihf, mcpu: cortex_a7,    ext: '' }
          - { name: linux-armv6,   kind: zig, zig_target: arm-linux-musleabihf, mcpu: arm1176jzf_s, ext: '' }
          - { name: linux-armv5,   kind: zig, zig_target: arm-linux-musleabi,   mcpu: arm926ej_s,   ext: '' }
          - { name: linux-mips,    kind: zig, zig_target: mips-linux-musl,      ext: '' }
          - { name: linux-mipsel,  kind: zig, zig_target: mipsel-linux-musl,    ext: '' }
          - { name: linux-riscv64, kind: zig, zig_target: riscv64-linux-musl,   ext: '' }
          - { name: linux-ppc64le, kind: zig, zig_target: powerpc64le-linux-musl, ext: '' }
          - { name: linux-s390x,   kind: zig, zig_target: s390x-linux-musl,     ext: '' }
          # ---- Windows via mingw-w64 --------------------------------
          - { name: windows-x86_64,    kind: mingw, triple: x86_64-w64-mingw32, ext: '.exe', toolchain: cmake/toolchain-mingw64.cmake }
          - { name: windows-i686-win7, kind: mingw, triple: i686-w64-mingw32,   ext: '.exe', toolchain: cmake/toolchain-mingw32.cmake }

    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake file xz-utils

      - name: Install mingw-w64
        if: matrix.kind == 'mingw'
        run: sudo apt-get install -y --no-install-recommends mingw-w64

      # Cache the Zig tarball so 11 parallel matrix legs only download
      # once. Bump ZIG_VERSION above + the suffix below to invalidate.
      - name: Cache Zig
        if: matrix.kind == 'zig'
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-${{ env.ZIG_VERSION }}-linux-x86_64-v1

      - name: Install Zig
        if: matrix.kind == 'zig' && steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -fsSL --retry 3 --connect-timeout 30 \
               -o zig.tar.xz \
               "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          sudo mv "zig-linux-x86_64-${ZIG_VERSION}" /opt/zig
          rm zig.tar.xz

      - name: Add Zig to PATH
        if: matrix.kind == 'zig'
        run: echo "/opt/zig" >> $GITHUB_PATH

      # Per-target shim scripts that pin the cross-target (and -mcpu for
      # the ARM variants) into a plain-named cc/cxx/ar/ranlib that CMake
      # finds via the environment. Without the shim we'd have to thread
      # `-target` through every CMake invocation, which doesn't survive
      # try_compile sub-projects.
      - name: Set up Zig cross shims
        if: matrix.kind == 'zig'
        run: |
          SHIM=/tmp/zig-shim
          mkdir -p "$SHIM"
          MCPU=""
          if [ -n "${{ matrix.mcpu }}" ]; then
            MCPU="-mcpu=${{ matrix.mcpu }}"
          fi
          cat > "$SHIM/cc" <<EOF
          #!/bin/sh
          exec zig cc -target ${{ matrix.zig_target }} $MCPU "\$@"
          EOF
          cat > "$SHIM/cxx" <<EOF
          #!/bin/sh
          exec zig c++ -target ${{ matrix.zig_target }} $MCPU "\$@"
          EOF
          cat > "$SHIM/ar"     <<'EOF'
          #!/bin/sh
          exec zig ar "$@"
          EOF
          cat > "$SHIM/ranlib" <<'EOF'
          #!/bin/sh
          exec zig ranlib "$@"
          EOF
          chmod +x "$SHIM"/*
          {
            echo "CC=$SHIM/cc"
            echo "CXX=$SHIM/cxx"
            echo "AR=$SHIM/ar"
            echo "RANLIB=$SHIM/ranlib"
            echo "AFM_ZIG_TARGET=${{ matrix.zig_target }}"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          if [ "${{ matrix.kind }}" = "zig" ]; then
            TC=cmake/toolchain-zig-cc.cmake
          else
            TC="${{ matrix.toolchain }}"
          fi
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$TC"

      - name: Build
        run: cmake --build build -j

      - name: Strip & stage binary
        run: |
          BIN=build/anonfm_vsrat_reader${{ matrix.ext }}
          OUT=anonfm_vsrat_reader-${{ matrix.name }}${{ matrix.ext }}
          mkdir -p dist
          # Strip with whatever knows the target ABI:
          # - mingw: triple-prefixed strip from binutils
          # - zig:   llvm-strip (handles every arch llvm knows; ships
          #          with the toolchain). Fall back to host strip if
          #          neither is around — losing strip is OK.
          if [ "${{ matrix.kind }}" = "mingw" ]; then
            "${{ matrix.triple }}-strip" "$BIN" || true
          else
            llvm-strip "$BIN" 2>/dev/null \
              || /opt/zig/lib/zig*/llvm-strip "$BIN" 2>/dev/null \
              || strip "$BIN" 2>/dev/null \
              || true
          fi
          cp "$BIN" "dist/$OUT"
          ls -la "dist/$OUT"
          file "dist/$OUT" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anonfm_vsrat_reader-${{ matrix.name }}
          path: dist/anonfm_vsrat_reader-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  # =====================================================================
  # Release: only on tag push. Pulls all per-target artifacts, drops
  # them into a single draft GitHub Release. Draft is intentional —
  # you review the binaries and hit "Publish" yourself.
  # =====================================================================
  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true   # flatten — every artifact contains
                                 # exactly one binary

      - name: List collected binaries
        run: |
          ls -la dist/
          echo "---"
          file dist/* || true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
